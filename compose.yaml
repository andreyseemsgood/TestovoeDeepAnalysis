services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: deep_analysis
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./TestovoeDeepAnalysis/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  api:
    build:
      context: .
      dockerfile: TestovoeDeepAnalysis/Dockerfile
    ports:
      - "8090:8080"
    depends_on:
      - postgres

  pgadmin:
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "True"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGPASS_FILE: /pgadmin4/pgpass
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass:ro
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data: